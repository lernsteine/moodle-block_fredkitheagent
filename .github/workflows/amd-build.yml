name: AMD build (temporary)

on:
  push:
    branches: [amd-build-tmp]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
      - run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_501_STABLE
      - name: Build AMD
        run: |
          cd moodle
          source $NVM_DIR/nvm.sh
          nvm use
          npx grunt amd --root=public/blocks/fredkitheagent
      - name: Commit the built files back to the branch
        run: |
          cp moodle/public/blocks/fredkitheagent/amd/build/* plugin/amd/build/
          cd plugin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add amd/build
          git commit -m "Rebuild AMD files" || echo "nothing to commit"
          git push
