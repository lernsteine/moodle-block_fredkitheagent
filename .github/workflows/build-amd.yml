name: Build AMD modules

# Rebuilds amd/build with Moodle's own toolchain (grunt amd) whenever amd/src changes on main,
# and commits the result, so the build files always match what Moodle's CI expects.
on:
  push:
    branches: [main]
    paths: ['amd/src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Build AMD modules with grunt
        run: |
          cd moodle
          # Use the Node version Moodle asks for (.nvmrc), as moodle-plugin-ci does.
          source "$NVM_DIR/nvm.sh"
          nvm install
          nvm use
          npx grunt amd --root=blocks/fredkitheagent
          rm -rf ../plugin/amd/build
          cp -r blocks/fredkitheagent/amd/build ../plugin/amd/build

      - name: Commit the build if it changed
        run: |
          cd plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          if git diff --cached --quiet; then
            echo "Build is up to date."
          else
            git commit -m "Rebuild AMD modules with grunt"
            git push
          fi
